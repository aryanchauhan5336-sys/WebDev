<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>learning CSS</title>
    <style>
        p{
            color:green;
        }

        #intro{
            color:orange;
        }

        .note{
