<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Photo gallery</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        .header {
            text-align: center;
            padding: 20px;
        }

       
        .container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            padding: 10px;
        }

        .container img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            display: block;
        }

        
        @media screen and (max-width: 768px) {
            .container {
                grid-template-columns: repeat(2, 1fr);
            }
        }

       
        @media screen and (max-width: 480px) {
            .container {
                grid-template-columns: 1fr;
            }
        }

    </style>
</head>

<body>

    <div class="header">
        <h1>Responsive Image Gallery</h1>
        <p>Resize the browser window to see the responsive effect.</p>
    </div>

    <div class="container">

        <img src="1.jpeg" alt="Image 1">
        <img src="2.jpeg" alt="Image 2">
        <img src="3.jpeg" alt="Image 3">

        <img src="4.jpeg" alt="Image 4">
        <img src="5.jpeg" alt="Image 5">
        <img src="6.jpeg" alt="Image 6">

        <img src="7.jpeg" alt="Image 7">
        <img src="8.jpeg" alt="Image 8">
        <img src="9.jpeg" alt="Image 9">

    </div>

</body>
</html>
