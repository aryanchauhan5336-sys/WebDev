
<!DOCTYPE html>
<html>
<head>
    <title>Parent Child Div</title>

    <style>
        

        .parent {
            width: 500px;
            height: 400px;
            border: 2px solid lch(3.2% 1.03 42.9);
            background-color: aqua;
            position: absolute;
            border-radius: 10px;
            top: 0;
            left: 0;
            box-sizing: border-box;
        }

        .name {
            position: absolute;
            font-weight: bold;
            font-size: 18px;
        }

        .top-left {
            top: 0;
            left: 0;
        }

        .top-right {
            top: 0;
            right: 0;
        }

        .bottom-left {
            bottom: 0;
            left: 0;
        }

        .bottom-right {
            bottom: 0;
            right: 0;
        }
    </style>
</head>

<body>

   
        
        <div class="parent">

            
            <span class="name top-left">Aryan</span>
            <span class="name top-right">Aryan</span>
            <span class="name bottom-left">Aryan</span>
            <span class="name bottom-right">Aryan</span>

        </div>

    </div>

</body>
</html>
