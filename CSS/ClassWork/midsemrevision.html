
<!DOCTYPE html>
<html>
<head>
    <title>Nested Div Boxes</title>
    <style>
        .big-box {
            width: 500px;
            height: 400px;
            background-color: rgb(21, 93, 226);
            border-radius: 10px;
            position: relative;
            text-align: right;
        }

        .small-box {
            width: 200px;
            height: 200px;
            background-color: #37e337;
            border-radius: 10px;
            position: absolute;
            bottom: 0;
            left: 0;
            text-align: right;
        }

    </style>
</head>
<body>

    <div class="big-box"><h1>Div 1</h1>
        <div class="small-box"><h1>Div 2</h1></div>
    </div>

</body>
</html>
