<!DOCTYPE html>
<html>
<head>
<style> 
div {
  width: 400px;
  height: 400px;
  background-color: rgb(15, 15, 226);
  transition: width 1s, height 1s, background-color 1s;
}

div:hover {
  width: 800px;
  height: 200px;
  background-color: #f00f1a;
}
</style>
</head>
<body>

<h1>The transition Property</h1>

<div></div>

</body>
</html>
